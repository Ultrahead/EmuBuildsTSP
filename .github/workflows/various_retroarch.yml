name: Build RetroArch (Standalone) Debian 11 ARM64 (TSP)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to clone (leave blank for latest)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Runner Disk Space & Create Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          # Allocate swap space to prevent memory exhaustion during LTO link stage
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout RetroArch
        run: |
          if [ -n "${{ inputs.commit_sha }}" ]; then
            echo "Cloning repository and checking out specific commit: ${{ inputs.commit_sha }}"
            git init RetroArch
            cd RetroArch
            git remote add origin https://github.com/libretro/RetroArch.git
            git fetch --depth 1 origin ${{ inputs.commit_sha }}
            git checkout FETCH_HEAD
            git submodule update --init --recursive --depth 1
          else
            echo "Cloning latest repository"
            git clone --recurse-submodules --depth 1 https://github.com/libretro/RetroArch.git RetroArch
          fi

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:latest

      - name: Build in Debian 11 (ARM64) Container
        run: |
          cat << 'EOF' > build_retroarch.sh
          #!/bin/bash
          set -e
          
          echo '=== Configuring APT for Archived Repositories ==='
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list

          # Pin priority > 1000 instructs APT to downgrade pre-installed container packages
          # to match the exact versions archived in bullseye main.
          cat << 'EOF_PREF' > /etc/apt/preferences.d/00-archive
          Package: *
          Pin: release n=bullseye
          Pin-Priority: 1001
          EOF_PREF

          echo '=== Installing Build Dependencies ==='
          apt-get update
          apt-get dist-upgrade -y --allow-downgrades
          apt-get install -y --allow-downgrades build-essential git wget unzip pkg-config \
                  libgles2-mesa-dev libegl1-mesa-dev libvulkan-dev \
                  libasound2-dev libudev-dev libfreetype6-dev libx11-dev
          
          echo '=== Deploying Custom SDL2 Blob ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          chmod -R +x /sdl2/bin
          
          # Injecting custom SDL2 into the environment
          export PATH="/sdl2/bin:$PATH"
          export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CPATH="/sdl2/include/SDL2:$CPATH"
          export LIBRARY_PATH="/sdl2/lib:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="/sdl2/lib:$LD_LIBRARY_PATH"

          # Microarchitecture tuning and Link-Time Optimization flags
          export CFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export CXXFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export LDFLAGS="-L/sdl2/lib -O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export AR="gcc-ar"
          export NM="gcc-nm"
          export RANLIB="gcc-ranlib"

          echo '=== Configuring RetroArch ==='
          cd /build/RetroArch
          
          # Configure script automatically appends exported CFLAGS/LDFLAGS into config.mk
          ./configure --prefix=/build/retroarch_installed \
                      --disable-x11 \
                      --disable-wayland \
                      --disable-qt \
                      --disable-kms \
                      --disable-opengl \
                      --disable-opengl1 \
                      --disable-opengl_core \
                      --disable-ffmpeg \
                      --disable-pulse \
                      --disable-oss \
                      --disable-neon \
                      --disable-videocore \
                      --enable-egl \
                      --enable-opengles \
                      --enable-opengles3_1 \
                      --enable-vulkan \
                      --with-sdl2 \
                      --with-vulkan

          echo '=== Compiling RetroArch ==='
          make -j$(nproc)
          
          echo '=== Installing to Prefix ==='
          make install
          
          echo '=== Stripping Binary ==='
          strip /build/retroarch_installed/bin/retroarch
          
          echo '=== Build Complete ==='
          EOF

          chmod +x build_retroarch.sh
          
          # Run the container in native ARM64 mode via QEMU
          docker run --rm \
            --platform linux/arm64 \
            --cpus="4.0" \
            --cpu-shares=4096 \
            --memory="6g" \
            -v ${{ github.workspace }}:/build \
            -e DEBIAN_FRONTEND=noninteractive \
            arm64v8/debian:11.11 /build/build_retroarch.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retroarch_tsp_debian11_arm64
          path: retroarch_installed/
