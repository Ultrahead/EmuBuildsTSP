name: Build MAME (Standalone) Debian 11 ARM64 (TSP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Checkout MAME
        run: |
          git clone --depth 1 --branch master https://github.com/mamedev/mame.git mame
          cd mame
          git submodule update --init --recursive --depth 1

      - name: CCache Initialization
        uses: actions/cache@v4
        with:
          path: .ccache
          key: mame-ccache-deb11-${{ github.run_id }}
          restore-keys: |
            mame-ccache-deb11-
          save-always: true

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in Native Debian 11 (ARM64) Container
        env:
          BUILD_SCRIPT: |
            #!/bin/bash
            set -e
            
            echo '=== Setting up Native Debian 11 (ARM64) Build Environment ==='
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y wget python3 pkg-config build-essential git unzip ccache make xz-utils lsb-release software-properties-common gnupg
            
            echo '=== Bypassing Git Dubious Ownership Security Lock ==='
            git config --global --add safe.directory /build/mame
            
            echo '=== Injecting LLVM/Clang 16 (Bypassing LLDB QEMU Crash) ==='
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            echo "deb http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-16 main" > /etc/apt/sources.list.d/llvm.list
            apt-get update
            apt-get install -y --no-install-recommends clang-16 lld-16 llvm-16 libc++-16-dev libc++abi-16-dev
            
            echo '=== Extracting Ghost Dependency Headers WITHOUT OS Pollution ==='
            mkdir -p /tmp/ghost_deps
            cd /tmp/ghost_deps
            
            apt-get download libgl-dev libgles-dev libx11-dev libxext-dev libxi-dev libsdl2-ttf-dev libfontconfig1-dev libfreetype6-dev || true
            
            mkdir -p /tmp/extracted
            for deb in *.deb; do
              [ -f "$deb" ] || continue
              dpkg -x "$deb" /tmp/extracted
            done
            
            echo '=== Deploying Custom SDL2 ==='
            wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
            mkdir -p /sdl2
            unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
            
            echo '=== Sideloading All Headers into Isolated Sandbox ==='
            cp -a /tmp/extracted/usr/include/* /sdl2/include/ || true
            if [ -d /tmp/extracted/usr/include/freetype2 ]; then
              cp -a /tmp/extracted/usr/include/freetype2/* /sdl2/include/ || true
            fi
            mkdir -p /sdl2/include/SDL2
            cp /tmp/extracted/usr/include/SDL2/SDL_ttf.h /sdl2/include/SDL2/ || true
            
            echo '=== Satisfying Linker Ghosts with Hollow Static Archives ==='
            echo 'void hollow_shell(){}' > /tmp/hollow.c
            echo 'int FcInit(){return 0;}' >> /tmp/hollow.c
            echo 'void FcFini(){}' >> /tmp/hollow.c
            echo 'int TTF_Init(){return 0;}' >> /tmp/hollow.c
            echo 'void TTF_Quit(){}' >> /tmp/hollow.c
            echo 'int TTF_WasInit(){return 0;}' >> /tmp/hollow.c
            
            clang-16 -c /tmp/hollow.c -o /tmp/hollow.o
            
            for ghost in GL X11 Xinerama Xext Xi SDL2_ttf fontconfig freetype; do
              llvm-ar-16 rcs "/sdl2/lib/lib${ghost}.a" /tmp/hollow.o
            done
            
            echo '=== Eradicating Toxic Linker Flags from SDL2 Configs ==='
            sed -i -E 's/-l(X11|Xext|Xinerama|Xi|GL)\b//g' /sdl2/lib/pkgconfig/sdl2.pc /sdl2/bin/sdl2-config || true
            
            export PATH="/sdl2/bin:$PATH"
            export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig"
            export PKG_CONFIG_LIBDIR="/sdl2/lib/pkgconfig"
            
            export CCACHE_DIR=/root/.ccache
            ccache -M 5G
            
            echo '=== NUCLEAR PURGE: Eradicating x86 flags ==='
            cd /build/mame
            grep -rIl '\-m64' . | xargs sed -i 's/-m64//g' || true
            grep -rIl '\-m32' . | xargs sed -i 's/-m32//g' || true
            
            echo '=== SOURCE CODE LOBOTOMY: Forcing MAME to forget Desktop Linux ==='
            find src -type f -name "*.cpp" -o -name "*.h" -o -name "*.mm" | xargs sed -i 's/SDLMAME_X11/IGNORE_X11/g' || true
            find src -type f -name "*.cpp" -o -name "*.h" -o -name "*.mm" | xargs sed -i 's/SDLMAME_WAYLAND/IGNORE_WAYLAND/g' || true
            find src -type f -name "*.cpp" -o -name "*.h" -o -name "*.mm" | xargs sed -i 's/SDLMAME_FONTCONFIG/IGNORE_FONTCONFIG/g' || true
            
            echo '=== SOURCE CODE LOBOTOMY: Erasing OpenGL, X11 Input, and Font Modules ==='
            echo '#include "osdcore.h"' > src/osd/modules/render/drawogl.cpp
            echo 'extern const char RENDERER_OPENGL[] = "opengl";' >> src/osd/modules/render/drawogl.cpp
            
            echo '#include "osdcore.h"' > src/osd/modules/opengl/gl_shader_mgr.cpp
            echo '#include "osdcore.h"' > src/osd/modules/opengl/gl_shader_tool.cpp
            
            echo '#include "osdcore.h"' > src/osd/modules/input/input_x11.cpp
            echo 'extern const char KEYBOARD_X11[] = "x11";' >> src/osd/modules/input/input_x11.cpp
            echo 'extern const char MOUSE_X11[] = "x11";' >> src/osd/modules/input/input_x11.cpp
            echo 'extern const char LIGHTGUN_X11[] = "x11";' >> src/osd/modules/input/input_x11.cpp
            
            echo '#include "osdcore.h"' > src/osd/modules/font/font_sdl.cpp
            echo 'extern const char FONT_SDL[] = "sdl";' >> src/osd/modules/font/font_sdl.cpp
            
            echo '=== Building GENie (Natively on Emulated ARM64) ==='
            cd /build/mame/3rdparty/genie/build/gmake.linux
            make clean
            make -j$(nproc) CC=clang-16 CXX=clang++-16
            
            echo '=== Compiling FULL MAME (Master via Clang 16 / libc++) ==='
            cd /build/mame
            
            export EXTRACFLAGS='-mno-unaligned-access -I/sdl2/include -I/sdl2/include/SDL2'
            export EXTRACXXFLAGS='-mno-unaligned-access -I/sdl2/include -I/sdl2/include/SDL2 -std=c++20'
            
            export LDFLAGS='-fuse-ld=lld-16 -Wl,-z,max-page-size=4096 -Wl,-z,common-page-size=4096 -Wl,--no-rosegment -L/sdl2/lib -Wl,-rpath='\''$$ORIGIN'\'' -Wl,--hash-style=both -Wl,--defsym=_ZN13ppc601_device24decrementer_int_callbackEi=hollow_shell'
            
            # USE_LIBCPP=1 injected directly to force GENie to use LLVM standard libraries for Precompiled Headers
            make -j$(nproc) \
                  CC="ccache clang-16" CXX="ccache clang++-16" \
                  OVERRIDE_CC="ccache clang-16" OVERRIDE_CXX="ccache clang++-16" OVERRIDE_LD="ccache clang++-16" OVERRIDE_AR="llvm-ar-16" \
                  CROSS_BUILD=0 TARGETOS=linux PTR64=1 NOWERROR=1 REGENIE=1 USE_LIBCPP=1 \
                  USE_QTDEBUG=0 USE_X11=0 USE_WAYLAND=0 USE_OPENGL=0 USE_BGFX=0 USE_FONTCONFIG=0 USE_XINPUT=0 \
                  NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_ALSA=1 NO_USE_PULSEAUDIO=1 \
                  PYTHON_EXECUTABLE=python3 || {
              echo "=== Parallel build failed! Running single-threaded to catch the exact linker error ==="
              make \
                  CC="ccache clang-16" CXX="ccache clang++-16" \
                  OVERRIDE_CC="ccache clang-16" OVERRIDE_CXX="ccache clang++-16" OVERRIDE_LD="ccache clang++-16" OVERRIDE_AR="llvm-ar-16" \
                  CROSS_BUILD=0 TARGETOS=linux PTR64=1 NOWERROR=1 USE_LIBCPP=1 \
                  USE_QTDEBUG=0 USE_X11=0 USE_WAYLAND=0 USE_OPENGL=0 USE_BGFX=0 USE_FONTCONFIG=0 USE_XINPUT=0 \
                  NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_ALSA=1 NO_USE_PULSEAUDIO=1 \
                  PYTHON_EXECUTABLE=python3 || {
                    echo '=== Final CCache Statistics (Failure) ==='
                    ccache -s
                    chmod -R 777 /root/.ccache || true
                    exit 1
              }
            }
                  
            echo '=== Extracting LLVM C++ Library Bundle ==='
            find /usr/lib -name "libc++*.so.1*" -exec cp -L {} /build/mame/ \;
                  
            echo '=== Library Dependencies for Final Binary ==='
            readelf -d /build/mame/mame* | grep NEEDED || true
            
            echo '=== Stripping Binary via LLVM-STRIP (Preserves 4KB ELF Alignment) ==='
            llvm-strip-16 /build/mame/mame || true
            
            echo '=== Final CCache Statistics (Success) ==='
            ccache -s
            chmod -R 777 /root/.ccache || true

        run: |
          echo "$BUILD_SCRIPT" > build_mame.sh
          chmod +x build_mame.sh
          docker run --rm \
            --platform linux/arm64 \
            -v ${{ github.workspace }}:/build \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:11 /build/build_mame.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mame_standalone_arm64_smartpro
          path: |
            mame/mame*
            mame/libc++*
