name: Build MAME (Standalone) Linux ARM64 (TSP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Checkout MAME
        run: |
          git clone --depth 1 --branch master https://github.com/mamedev/mame.git mame
          cd mame
          git submodule update --init --recursive --depth 1

      - name: CCache Initialization
        uses: actions/cache@v4
        with:
          path: .ccache
          key: mame-ccache-${{ github.run_id }}
          restore-keys: |
            mame-ccache-

      - name: Build in Ubuntu 21.04 Container
        run: |
          cat << 'EOF' > build_mame.sh
          #!/bin/bash
          set -e
          
          echo '=== Resurrecting Ubuntu 21.04 Repositories ==='
          sed -i -re 's/([a-z]{2}\.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          
          echo '=== Setting up Build Environment ==='
          apt-get update
          apt-get install -y software-properties-common wget python3 pkg-config \
                  build-essential git unzip ccache coreutils make xz-utils
          
          echo '=== Installing Native & Cross GCC-11 ==='
          apt-get install -y gcc-11 g++-11 gcc-11-aarch64-linux-gnu \
                  g++-11-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          echo '=== Sideloading GL/X11 Headers into ARM64 Sysroot ==='
          apt-get install -y libgl-dev libgles-dev libx11-dev libxext-dev libxi-dev
          cp -a /usr/include/GL /usr/aarch64-linux-gnu/include/ || true
          cp -a /usr/include/EGL /usr/aarch64-linux-gnu/include/ || true
          cp -a /usr/include/KHR /usr/aarch64-linux-gnu/include/ || true
          cp -a /usr/include/GLES2 /usr/aarch64-linux-gnu/include/ || true
          cp -a /usr/include/GLES3 /usr/aarch64-linux-gnu/include/ || true
          cp -a /usr/include/X11 /usr/aarch64-linux-gnu/include/ || true
          
          echo '=== Extracting Ghost Dependency Headers WITHOUT pkg-config Pollution ==='
          mkdir -p /tmp/ghost_deps
          chown _apt /tmp/ghost_deps || true
          cd /tmp/ghost_deps
          
          apt-get download libsdl2-ttf-dev || true
          apt-get download libfontconfig-dev || true
          apt-get download libfontconfig1-dev || true
          apt-get download libfreetype-dev || true
          apt-get download libfreetype6-dev || true
          
          mkdir -p /tmp/extracted
          for deb in *.deb; do
            [ -f "$deb" ] || continue
            dpkg -x "$deb" /tmp/extracted
          done
          
          echo '=== Deploying Custom SDL2 ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          
          echo '=== Providing ARM64 Shared Libraries for the TTF Linker Chain ==='
          # Download all the required libraries to satisfy the Freetype -> PNG -> Brotli -> Zlib chain
          wget -q http://old-releases.ubuntu.com/ubuntu/pool/universe/libs/libsdl2-ttf/libsdl2-ttf-2.0-0_2.0.15+dfsg1-1_arm64.deb -O /tmp/libsdl2-ttf.deb
          wget -q http://old-releases.ubuntu.com/ubuntu/pool/main/f/freetype/libfreetype6_2.10.4+dfsg-1build1_arm64.deb -O /tmp/libfreetype6.deb
          wget -q http://old-releases.ubuntu.com/ubuntu/pool/main/f/fontconfig/libfontconfig1_2.13.1-4.2ubuntu3_arm64.deb -O /tmp/libfontconfig1.deb
          wget -q http://old-releases.ubuntu.com/ubuntu/pool/main/libp/libpng1.6/libpng16-16_1.6.37-3build5_arm64.deb -O /tmp/libpng16.deb
          wget -q http://old-releases.ubuntu.com/ubuntu/pool/main/z/zlib/zlib1g_1.2.11.dfsg-2ubuntu4_arm64.deb -O /tmp/zlib1g.deb
          wget -q http://old-releases.ubuntu.com/ubuntu/pool/main/b/brotli/libbrotli1_1.0.9-2build1_arm64.deb -O /tmp/libbrotli1.deb
          
          for deb in /tmp/*.deb; do dpkg -x "$deb" /tmp/libs; done
          
          cp -a /tmp/libs/usr/lib/aarch64-linux-gnu/*.so* /sdl2/lib/ || true
          cp -a /tmp/libs/lib/aarch64-linux-gnu/*.so* /sdl2/lib/ || true
          
          # Fix up the critical symlinks for the linker
          ln -sf /sdl2/lib/libSDL2_ttf-2.0.so.0 /sdl2/lib/libSDL2_ttf.so
          ln -sf /sdl2/lib/libfreetype.so.6 /sdl2/lib/libfreetype.so
          ln -sf /sdl2/lib/libfontconfig.so.1 /sdl2/lib/libfontconfig.so
          ln -sf /sdl2/lib/libpng16.so.16 /sdl2/lib/libpng16.so
          ln -sf /sdl2/lib/libz.so.1 /sdl2/lib/libz.so
          
          echo '=== Eradicating Toxic Linker Flags from SDL2 Configs ==='
          sed -i -E 's/-l(X11|Xext|Xinerama|Xi|GL)\b//g' /sdl2/lib/pkgconfig/sdl2.pc /sdl2/bin/sdl2-config || true
          
          echo '=== Sideloading Font Headers into Custom SDL Sandbox ==='
          cp -a /tmp/extracted/usr/include/* /usr/aarch64-linux-gnu/include/ || true
          cp -a /tmp/extracted/usr/include/* /sdl2/include/ || true
          
          if [ -d /tmp/extracted/usr/include/freetype2 ]; then
            cp -a /tmp/extracted/usr/include/freetype2/* /usr/aarch64-linux-gnu/include/ || true
            cp -a /tmp/extracted/usr/include/freetype2/* /sdl2/include/ || true
          fi
          
          mkdir -p /sdl2/include/SDL2
          cp /tmp/extracted/usr/include/SDL2/SDL_ttf.h /sdl2/include/SDL2/ || true
          
          export PATH="/sdl2/bin:$PATH"
          export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="/sdl2/lib/pkgconfig"
          export CCACHE_DIR=/root/.ccache
          ccache -M 5G
          
          echo '=== NUCLEAR PURGE: Eradicating x86 flags ==='
          cd /build/mame
          grep -rIl '\-m64' . | xargs sed -i 's/-m64//g' || true
          grep -rIl '\-m32' . | xargs sed -i 's/-m32//g' || true
          
          echo '=== SOURCE CODE LOBOTOMY: Completely Erasing OpenGL and X11 Modules ==='
          # We forcefully gut the OpenGL renderer and X11 input files so the compiler generates empty object files.
          # This prevents the linker from ever searching for GL or X11 functions.
          echo '#include "osdcore.h"' > src/osd/modules/render/drawogl.cpp
          echo '#include "osdcore.h"' > src/osd/modules/input/input_x11.cpp
          echo '#include "osdcore.h"' > src/osd/sdl/window.cpp
          echo '#include "osdcore.h"' > src/osd/modules/opengl/gl_shader_mgr.cpp
          echo '#include "osdcore.h"' > src/osd/modules/opengl/gl_shader_tool.cpp
          
          echo '=== Creating C++20 Compiler Wrappers ==='
          cat << 'WRAPPER' > /usr/local/bin/arm64-g++-wrapper
          #!/bin/bash
          exec ccache aarch64-linux-gnu-g++-11 -std=c++20 "$@"
          WRAPPER
          chmod +x /usr/local/bin/arm64-g++-wrapper
          
          cat << 'WRAPPER' > /usr/local/bin/host-g++-wrapper
          #!/bin/bash
          exec ccache g++-11 -std=c++20 "$@"
          WRAPPER
          chmod +x /usr/local/bin/host-g++-wrapper
          
          echo '=== Building GENie (Natively) ==='
          cd /build/mame/3rdparty/genie/build/gmake.linux
          make clean
          make -j$(nproc) CC=gcc-11 CXX=g++-11
          
          echo '=== Compiling FULL MAME ==='
          cd /build/mame
          
          export HOSTCC='ccache gcc-11'
          export HOSTCXX='host-g++-wrapper'
          export OVERRIDE_CC='ccache aarch64-linux-gnu-gcc-11'
          export OVERRIDE_CXX='arm64-g++-wrapper'
          export OVERRIDE_LD='arm64-g++-wrapper'
          export OVERRIDE_AR='aarch64-linux-gnu-ar'
          
          export EXTRACFLAGS='-I/sdl2/include -I/sdl2/include/SDL2 --param ggc-min-expand=10'
          export EXTRACXXFLAGS='-I/sdl2/include -I/sdl2/include/SDL2 --param ggc-min-expand=10 -std=c++20'
          
          # Explicit -rpath guarantees the Freetype dependency chain resolves locally in the sandbox
          export LDFLAGS='-L/sdl2/lib -Wl,-rpath,/sdl2/lib -Wl,--hash-style=both'
          
          make -j$(nproc) \
                CROSS_BUILD=1 TARGETOS=linux PTR64=1 NOWERROR=1 REGENIE=1 \
                USE_QTDEBUG=0 USE_X11=0 USE_WAYLAND=0 USE_OPENGL=0 USE_BGFX=0 USE_FONTCONFIG=0 USE_XINPUT=0 \
                NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_ALSA=1 NO_USE_PULSEAUDIO=1 \
                PYTHON_EXECUTABLE=python3 || {
            echo "=== Parallel build failed! Running single-threaded to catch the exact linker error ==="
            make CROSS_BUILD=1 TARGETOS=linux PTR64=1 NOWERROR=1 \
                USE_QTDEBUG=0 USE_X11=0 USE_WAYLAND=0 USE_OPENGL=0 USE_BGFX=0 USE_FONTCONFIG=0 USE_XINPUT=0 \
                NO_USE_MIDI=1 NO_USE_PORTAUDIO=1 NO_USE_ALSA=1 NO_USE_PULSEAUDIO=1 \
                PYTHON_EXECUTABLE=python3
            exit 1
          }
                
          echo '=== Library Dependencies for Final Binary ==='
          aarch64-linux-gnu-readelf -d /build/mame/mame* | grep NEEDED || true
          
          aarch64-linux-gnu-strip /build/mame/mame* || true
          EOF

          chmod +x build_mame.sh
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:21.04 /build/build_mame.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mame_standalone_arm64_smartpro
          path: mame/mame*
