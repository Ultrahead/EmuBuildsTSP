name: Build TI-99/4A Sim (Standalone) Debian 11 ARM64 (TSP)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version or archive name (e.g. 0.16.0 or ti99sim-0.16.0.src.tar.xz, leave blank for latest)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Runner Disk Space & Create Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo fallocate -l 4G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:latest

      - name: Build in Debian 11 (ARM64) Container
        run: |
          cat << 'EOF' > build_ti99sim.sh
          #!/bin/bash
          set -e

          echo '=== Bypassing QEMU ldconfig Crash ==='
          dpkg-divert --local --rename --add /sbin/ldconfig
          ln -sf /bin/true /sbin/ldconfig

          echo '=== Configuring APT for Archived Repositories ==='
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list

          cat << 'EOF_PREF' > /etc/apt/preferences.d/00-archive
          Package: *
          Pin: release n=bullseye
          Pin-Priority: 1001
          EOF_PREF

          echo '=== Installing Build Dependencies ==='
          apt-get update
          apt-get dist-upgrade -y --allow-downgrades
          apt-get install -y --allow-downgrades build-essential wget curl xz-utils unzip pkg-config coreutils make \
                  libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev libssl-dev

          echo '=== Safeguard: Fixing Permissions ==='
          chown -R root:root /build

          echo '=== Fetching ti99sim Source ==='
          BASE_URL="https://www.mrousseau.org/programs/ti99sim/archives/"

          if [ -n "$TARGET_VERSION" ]; then
            if [[ "$TARGET_VERSION" == *.tar.xz ]]; then
              CHOSEN_FILE="$TARGET_VERSION"
            else
              CHOSEN_FILE="ti99sim-${TARGET_VERSION}.src.tar.xz"
            fi
            echo "Targeting specified archive: $CHOSEN_FILE"
          else
            echo "Scanning for latest release archive..."
            CHOSEN_FILE=$(curl -s $BASE_URL | grep -oP 'ti99sim-[\d\.]+\.src\.tar\.xz' | sort -V | tail -1)
          fi

          if [ -z "$CHOSEN_FILE" ]; then
            echo "ERROR: Could not resolve source file at $BASE_URL"
            exit 1
          fi

          echo "Downloading $CHOSEN_FILE..."
          wget "${BASE_URL}${CHOSEN_FILE}"
          tar -xvf "$CHOSEN_FILE"
          cd ti99sim-*/

          echo '=== Deploying Custom SDL2 Blob ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          chmod -R +x /sdl2/bin

          export PATH="/sdl2/bin:$PATH"
          export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CPATH="/sdl2/include/SDL2:$CPATH"
          export LIBRARY_PATH="/sdl2/lib:$LIBRARY_PATH"
          export CFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export CXXFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export LDFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"

          echo '=== Compiling TI-99/4A Simulator ==='
          make -j$(nproc)

          echo '=== Collecting Binaries Manually ==='
          mkdir -p /build/output

          if [ -d "bin" ]; then
            cp -r bin/* /build/output/
          fi

          make install PREFIX=/build/output || true

          echo '=== Stripping Binaries ==='
          find /build/output -type f -executable -exec strip {} + || true

          echo '=== Final Check ==='
          ls -R /build/output
          EOF

          chmod +x build_ti99sim.sh

          docker run --rm \
            --platform linux/arm64 \
            --cpus="4.0" \
            --cpu-shares=4096 \
            --memory="6g" \
            -v ${{ github.workspace }}:/build \
            -e DEBIAN_FRONTEND=noninteractive \
            -e TARGET_VERSION="${{ inputs.version }}" \
            arm64v8/debian:11.11 /build/build_ti99sim.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ti99sim_standalone_tsp_arm64
          path: output/
