name: Build MAME (Standalone) Linux ARM64 (TSP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Checkout MAME
        run: |
          git clone --depth 1 --branch master https://github.com/mamedev/mame.git mame
          cd mame
          git submodule update --init --recursive --depth 1

      - name: CCache Initialization
        uses: actions/cache@v4
        with:
          path: .ccache
          key: mame-standalone-ccache-${{ github.run_id }}
          restore-keys: |
            mame-standalone-ccache-

      - name: Build in Ubuntu 20.04 Container
        run: |
          cat << 'EOF' > build_mame.sh
          #!/bin/bash
          set -e
          
          echo '=== Setting up Build Environment ==='
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y software-properties-common wget python3 pkg-config \
                  build-essential git unzip ccache coreutils make xz-utils \
                  libgl1-mesa-dev libegl1-mesa-dev
          
          echo '=== Updating Host GCC Toolchain ==='
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y gcc-11 g++-11
          
          echo '=== Downloading ARM GCC 11 Cross-Compiler ==='
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/11.3.rel1/binrel/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -C /opt
          export PATH="/opt/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu/bin:$PATH"
          
          echo '=== Deploying Custom SDL2 ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          
          export PATH="/sdl2/bin:$PATH"
          export CCACHE_DIR=/root/.ccache
          ccache -M 5G
          
          echo '=== Building GENie (Natively) ==='
          cd /build/mame/3rdparty/genie/build/gmake.linux
          make clean
          make -j$(nproc) CC=gcc-11 CXX=g++-11
          
          echo '=== Compiling FULL MAME ==='
          cd /build/mame
          make -j$(nproc) \
              OSD=sdl \
              TARGETOS=linux \
              ARCHITECTURE=_aarch64 \
              PTR64=1 \
              TARGET_SUFFIX= \
              USE_X11=0 \
              USE_WAYLAND=0 \
              USE_OPENGL=0 \
              USE_BGFX=0 \
              USE_QTDEBUG=0 \
              USE_ALSA=0 \
              USE_PORTAUDIO=0 \
              USE_PULSEAUDIO=0 \
              USE_FONTCONFIG=0 \
              USE_MIDI=0 \
              USE_TAP=0 \
              USE_PCAP=0 \
              NOWERROR=1 \
              CROSS_BUILD=1 \
              HOSTCC='ccache gcc-11' \
              HOSTCXX='ccache g++-11' \
              OVERRIDE_CC='ccache aarch64-none-linux-gnu-gcc' \
              OVERRIDE_CXX='ccache aarch64-none-linux-gnu-g++' \
              PYTHON_EXECUTABLE=python3 \
              PKG_CONFIG=/bin/false \
              EXTRACFLAGS='-I/sdl2/include/SDL2 --param ggc-min-expand=10' \
              EXTRACXXFLAGS='-I/sdl2/include/SDL2 --param ggc-min-expand=10' \
              LDFLAGS='-L/sdl2/lib -Wl,--hash-style=both'
              
          aarch64-none-linux-gnu-strip /build/mame/mame
          EOF

          chmod +x build_mame.sh
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 /build/build_mame.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mame_standalone_arm64_smartpro
          path: mame/mame
