name: Build MAME (Standalone) Linux ARM64 (TSP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Checkout MAME
        run: |
          git clone --depth 1 --branch master https://github.com/mamedev/mame.git mame
          cd mame
          git submodule update --init --recursive --depth 1

      - name: CCache Initialization
        uses: actions/cache@v4
        with:
          path: .ccache
          key: mame-ccache-${{ github.run_id }}
          restore-keys: |
            mame-ccache-

      - name: Build in Ubuntu 21.04 Container
        run: |
          cat << 'EOF' > build_mame.sh
          #!/bin/bash
          set -e
          
          echo '=== Resurrecting Ubuntu 21.04 Repositories ==='
          sed -i -re 's/([a-z]{2}\.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list
          
          echo '=== Setting up Build Environment ==='
          apt-get update
          apt-get install -y software-properties-common wget python3 pkg-config \
                  build-essential git unzip ccache coreutils make xz-utils
          
          echo '=== Installing Native & Cross GCC-11 ==='
          apt-get install -y gcc-11 g++-11 gcc-11-aarch64-linux-gnu \
                  g++-11-aarch64-linux-gnu binutils-aarch64-linux-gnu
          
          echo '=== Deploying Custom SDL2 ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          
          export PATH="/sdl2/bin:$PATH"
          export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PKG_CONFIG_LIBDIR="/sdl2/lib/pkgconfig"
          export CCACHE_DIR=/root/.ccache
          ccache -M 5G
          
          echo '=== NUCLEAR PURGE: Eradicating x86 flags ==='
          cd /build/mame
          grep -rIl '\-m64' . | xargs sed -i 's/-m64//g' || true
          grep -rIl '\-m32' . | xargs sed -i 's/-m32//g' || true
          
          echo '=== Building GENie (Natively) ==='
          cd /build/mame/3rdparty/genie/build/gmake.linux
          make clean
          make -j$(nproc) CC=gcc-11 CXX=g++-11
          
          echo '=== Compiling FULL MAME ==='
          cd /build/mame
          make -j$(nproc) \
                TARGETOS=linux \
                PTR64=1 \
                USE_LUA=1 \
                NOWERROR=1 \
                CROSS_BUILD=1 \
                USE_QTDEBUG=0 \
                USE_X11=0 \
                USE_WAYLAND=0 \
                NO_USE_MIDI=1 \
                USE_OPENGL=0 \
                USE_BGFX=0 \
                HOSTCC='ccache gcc-11' \
                HOSTCXX='ccache g++-11' \
                CC='ccache aarch64-linux-gnu-gcc-11' \
                CXX='ccache aarch64-linux-gnu-g++-11' \
                PYTHON_EXECUTABLE=python3 \
                EXTRACFLAGS='-I/sdl2/include/SDL2 --param ggc-min-expand=10' \
                EXTRACXXFLAGS='-I/sdl2/include/SDL2 --param ggc-min-expand=10' \
                LDFLAGS='-L/sdl2/lib -Wl,--hash-style=both'
                
          aarch64-linux-gnu-strip /build/mame/mame
          EOF

          chmod +x build_mame.sh
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:21.04 /build/build_mame.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mame_standalone_arm64_smartpro
          path: mame/mame
