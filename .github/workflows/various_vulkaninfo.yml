name: Build VulkanInfo Debian 11 ARM64 (TSP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Checkout Repositories
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Loader.git Vulkan-Loader
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Tools.git Vulkan-Tools

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:latest

      - name: Build in Debian 11 (ARM64) Container
        run: |
          cat << 'EOF' > build_vulkan_stack.sh
          #!/bin/bash
          set -e

          echo '=== Configuring APT for Archived Repositories ==='
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list

          cat << 'EOF_PREF' > /etc/apt/preferences.d/00-archive
          Package: *
          Pin: release n=bullseye
          Pin-Priority: 1001
          EOF_PREF

          echo '=== Installing Build Dependencies ==='
          apt-get update
          apt-get dist-upgrade -y --allow-downgrades
          apt-get install -y --allow-downgrades build-essential git wget pkg-config \
                  python3 python3-pip

          git config --global --add safe.directory '*'

          echo '=== Installing CMake and Ninja ==='
          pip3 install --no-cache-dir cmake ninja

          echo '=== Building Vulkan-Headers ==='
          mkdir -p /build/Vulkan-Headers/build
          cd /build/Vulkan-Headers/build
          cmake -GNinja -DCMAKE_INSTALL_PREFIX=/usr/local ..
          ninja install

          echo '=== Building Khronos Vulkan-Loader ==='
          mkdir -p /build/Vulkan-Loader/build
          cd /build/Vulkan-Loader/build
          cmake -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DBUILD_TESTS=OFF \
                -DBUILD_WERROR=OFF \
                -DBUILD_WSI_XCB_SUPPORT=OFF \
                -DBUILD_WSI_XLIB_SUPPORT=OFF \
                -DBUILD_WSI_WAYLAND_SUPPORT=OFF \
                ..
          ninja install

          # Prepare artifact directories
          mkdir -p /build/vulkaninfo_installed/bin
          mkdir -p /build/vulkaninfo_installed/lib64
          mkdir -p /build/vulkaninfo_installed/etc/vulkan/icd.d

          # Copy official loader to artifact package
          cp -a /usr/local/lib/libvulkan.so* /build/vulkaninfo_installed/lib64/

          echo '=== Building vulkaninfo ==='
          mkdir -p /build/Vulkan-Tools/build
          cd /build/Vulkan-Tools/build
          cmake -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/build/vulkaninfo_installed \
                -DBUILD_VULKANINFO=ON \
                -DBUILD_CUBE=OFF \
                -DBUILD_ICD=OFF \
                -DBUILD_WERROR=OFF \
                -DBUILD_WSI_XCB_SUPPORT=OFF \
                -DBUILD_WSI_XLIB_SUPPORT=OFF \
                -DBUILD_WSI_WAYLAND_SUPPORT=OFF \
                ..
          ninja vulkaninfo
          ninja install

          echo '=== Generating PowerVR ICD Manifest ==='
          cat << 'EOF_ICD' > /build/vulkaninfo_installed/etc/vulkan/icd.d/powervr_icd.json
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "/usr/lib/libVK_IMG.so.1",
                  "api_version": "1.0.0"
              }
          }
          EOF_ICD

          echo '=== Stripping Binaries ==='
          strip /build/vulkaninfo_installed/bin/vulkaninfo
          strip /build/vulkaninfo_installed/lib64/libvulkan.so.*.*.* 2>/dev/null || true

          echo '=== Build Complete ==='
          EOF

          chmod +x build_vulkan_stack.sh

          docker run --rm \
            --platform linux/arm64 \
            --cpus="2.0" \
            --cpu-shares=2048 \
            --memory="6g" \
            -v ${{ github.workspace }}:/build \
            -e DEBIAN_FRONTEND=noninteractive \
            arm64v8/debian:11.11 /build/build_vulkan_stack.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vulkaninfo_tsp_debian11_arm64
          path: vulkaninfo_installed/
