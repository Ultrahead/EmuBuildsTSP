name: Build SimCoupe (Standalone) Debian 11 ARM64 (TSP)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to clone (leave blank for latest)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Runner Disk Space & Create Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo fallocate -l 4G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Checkout SimCoupe (Dev Branch)
        run: |
          if [ -n "${{ inputs.commit_sha }}" ]; then
            echo "Cloning repository and checking out specific commit: ${{ inputs.commit_sha }}"
            git init simcoupe
            cd simcoupe
            git remote add origin https://github.com/simonowen/simcoupe.git
            git fetch --depth 1 origin ${{ inputs.commit_sha }}
            git checkout FETCH_HEAD
            git submodule update --init --recursive --depth 1
          else
            echo "Cloning latest repository"
            git clone --branch dev --recurse-submodules --depth 1 https://github.com/simonowen/simcoupe.git simcoupe
          fi

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:latest

      - name: Build in Debian 11 (ARM64) Container
        run: |
          cat << 'EOF' > build_simcoupe.sh
          #!/bin/bash
          set -e

          echo '=== Bypassing QEMU ldconfig Crash ==='
          dpkg-divert --local --rename --add /sbin/ldconfig
          ln -sf /bin/true /sbin/ldconfig

          echo '=== Configuring APT for Archived Repositories ==='
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list

          cat << 'EOF_PREF' > /etc/apt/preferences.d/00-archive
          Package: *
          Pin: release n=bullseye
          Pin-Priority: 1001
          EOF_PREF

          echo '=== Installing Build Dependencies ==='
          apt-get update
          apt-get dist-upgrade -y --allow-downgrades
          apt-get install -y --allow-downgrades build-essential git wget unzip pkg-config coreutils make \
                  python3 python3-pip \
                  libasound2-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev libbz2-dev

          # Install modern CMake (>= 3.28) via pip because Debian 11 apt only provides 3.18.4
          pip3 install cmake

          echo '=== Safeguard: Fixing Permissions and Git Trust ==='
          chown -R root:root /build
          git config --global --add safe.directory '*'

          echo '=== Deploying Custom SDL2 Blob ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          chmod -R +x /sdl2/bin

          export PATH="/usr/local/bin:/sdl2/bin:$PATH"
          export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CPATH="/sdl2/include:/sdl2/include/SDL2:$CPATH"
          export LIBRARY_PATH="/sdl2/lib:$LIBRARY_PATH"

          echo '=== Verifying CMake Version ==='
          cmake --version

          echo '=== Configuring & Compiling SimCoupe ==='
          cd /build/simcoupe
          mkdir -p build && cd build

          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_PREFIX_PATH=/sdl2 \
                   -DSDL2_INCLUDE_DIR=/sdl2/include/SDL2 \
                   -DSDL2_LIBRARY=/sdl2/lib/libSDL2.so \
                   -DCMAKE_C_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto" \
                   -DCMAKE_CXX_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto" \
                   -DCMAKE_EXE_LINKER_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"

          make -j$(nproc)

          echo '=== Packaging Binary ==='
          mkdir -p /build/output
          if [ -f "simcoupe" ]; then
             strip simcoupe
             cp simcoupe /build/output/simcoupe
          fi
          EOF

          chmod +x build_simcoupe.sh

          docker run --rm \
            --platform linux/arm64 \
            --cpus="4.0" \
            --cpu-shares=4096 \
            --memory="6g" \
            -v ${{ github.workspace }}:/build \
            -e DEBIAN_FRONTEND=noninteractive \
            arm64v8/debian:11.11 /build/build_simcoupe.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simcoupe_standalone_tsp_arm64
          path: output/simcoupe
