name: Build XRoar-Dragon32 (Standalone) Debian 11 ARM64 (TSP)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full commit SHA to clone (leave blank for latest)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Runner Disk Space & Create Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          sudo fallocate -l 4G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2

      - name: Checkout XRoar
        run: |
          if [ -n "${{ inputs.commit_sha }}" ]; then
            echo "Cloning repository and checking out specific commit: ${{ inputs.commit_sha }}"
            git clone --recurse-submodules https://www.6809.org.uk/git/xroar.git xroar
            cd xroar
            git checkout ${{ inputs.commit_sha }}
            git submodule update --init --recursive
          else
            echo "Cloning latest repository"
            git clone --recurse-submodules https://www.6809.org.uk/git/xroar.git xroar
          fi

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          image: tonistiigi/binfmt:latest

      - name: Build in Debian 11 (ARM64) Container
        run: |
          cat << 'EOF' > build_xroar.sh
          #!/bin/bash
          set -e

          echo '=== Bypassing QEMU ldconfig Crash ==='
          dpkg-divert --local --rename --add /sbin/ldconfig
          ln -sf /bin/true /sbin/ldconfig

          echo '=== Configuring APT for Archived Repositories ==='
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list

          cat << 'EOF_PREF' > /etc/apt/preferences.d/00-archive
          Package: *
          Pin: release n=bullseye
          Pin-Priority: 1001
          EOF_PREF

          echo '=== Installing Build Dependencies ==='
          apt-get update
          apt-get dist-upgrade -y --allow-downgrades
          apt-get install -y --allow-downgrades build-essential git wget unzip pkg-config coreutils \
                  autoconf automake libtool make texinfo \
                  libasound2-dev libudev-dev libsndfile1-dev libjack-dev \
                  libgles2-mesa-dev libegl1-mesa-dev

          echo '=== Safeguard: Fixing Permissions and Git Trust ==='
          chown -R root:root /build
          git config --global --add safe.directory '*'

          echo '=== Deploying Custom SDL2 Blob ==='
          wget -q https://raw.githubusercontent.com/Ultrahead/EmuBuildsTSP/main/blobs/SDL2-2.26.1_TSP.zip
          mkdir -p /sdl2
          unzip -q SDL2-2.26.1_TSP.zip -d /sdl2
          chmod -R +x /sdl2/bin

          export PATH="/sdl2/bin:$PATH"
          export PKG_CONFIG_PATH="/sdl2/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export CXXFLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export LDFLAGS="-L/sdl2/lib -O3 -mcpu=cortex-a53 -mtune=cortex-a53 -flto"
          export CPPFLAGS="-I/sdl2/include/SDL2"

          echo '=== Running XRoar Build Sequence ==='
          cd /build/xroar

          ./autogen.sh

          ./configure --prefix=/build/output \
                      --without-x \
                      --without-gtk3 \
                      --without-gtk2 \
                      --without-gtkgl \
                      --without-cocoa \
                      --without-oss \
                      --without-pulse \
                      --without-coreaudio \
                      --with-jack \
                      --enable-dragon \
                      --enable-coco3 \
                      --enable-mc10 \
                      --enable-experimental \
                      --enable-ui-sdl \
                      --disable-gdb-target \
                      --disable-sdltest

          make -j$(( $(nproc) + 1))

          make install

          echo '=== Stripping Binary ==='
          if [ -f "/build/output/bin/xroar" ]; then
            strip /build/output/bin/xroar
          fi

          echo '=== Build Complete ==='
          EOF

          chmod +x build_xroar.sh

          docker run --rm \
            --platform linux/arm64 \
            --cpus="4.0" \
            --cpu-shares=4096 \
            --memory="6g" \
            -v ${{ github.workspace }}:/build \
            -e DEBIAN_FRONTEND=noninteractive \
            arm64v8/debian:11.11 /build/build_xroar.sh

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xroar_dragon32_standalone_tsp_arm64
          path: output/
